<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreaMax - Assinatura</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="tela-assinatura">

    <header class="menu-principal">
        <a href="index.html" class="logo-streamax">STREAMAX</a>
        <nav class="menu-links">
            <a href="index.html">Perfis</a>
            <a href="home1.html">Voltar ao catálogo</a>
        </nav>
    </header>

    <main class="pagina-assinatura">

        <section class="caixa-assinatura" id="escolha-plano">
            <div class="icone-cadeado">🔒</div>
            <span class="etiqueta">STREAMAX PREMIUM</span>
            <h1>Escolha seu plano</h1>
            <p>Assine para aproveitar filmes e séries sem limites.</p>

            <label class="plano-opcao">
                <input type="radio" name="plano" value="Básico" checked>
                <strong>Plano Básico</strong>
                <span>R$ 19,90 <small>/ mês</small></span>
                <p>Filmes e séries em qualidade HD.</p>
            </label>

            <label class="plano-opcao plano-popular">
                <input type="radio" name="plano" value="Premium">
                <strong>Plano Premium</strong>
                <span>R$ 29,90 <small>/ mês</small></span>
                <p>Catálogo completo em qualidade 4K.</p>
            </label>

            <button class="botao-planos" type="button" id="botao-continuar">
                Continuar
            </button>

            <small>Preços ilustrativos. Esta demonstração não realiza cobranças.</small>
        </section>

        <section class="caixa-assinatura" id="confirmacao" hidden>
            <div class="icone-cadeado">⭐</div>
            <h1>Plano selecionado!</h1>
            <p id="texto-confirmacao"></p>
            <p>Esta é uma demonstração escolar. Nenhum pagamento foi realizado.</p>
            <a href="index.html" class="botao-planos">Voltar aos perfis</a>
        </section>

    </main>

    <script>
        document.getElementById("botao-continuar").addEventListener("click", function () {
            const planoEscolhido = document.querySelector('input[name="plano"]:checked');
            const nomePlano = planoEscolhido ? planoEscolhido.value : "Básico";

            document.getElementById("texto-confirmacao").textContent =
                "Você escolheu o Plano " + nomePlano + ".";

            document.getElementById("escolha-plano").hidden = true;
            document.getElementById("confirmacao").hidden = false;
        });
    </script>

</body>
</html>
